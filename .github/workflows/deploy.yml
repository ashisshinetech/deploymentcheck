name: Deploy
 
on:

  push:

    branches:

      - main
 
jobs:

  deploy:

    runs-on: ubuntu-latest
 
    steps:

      - name: Deploy via SSH

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SERVER_HOST }}

          username: ${{ secrets.SERVER_USERNAME }}

          key: ${{ secrets.SERVER_SSH_KEY }}

          port: ${{ secrets.SERVER_PORT }}
 
          script: |

            echo "Connected Successfully"

            whoami

            pwd

            ls -la 
 
